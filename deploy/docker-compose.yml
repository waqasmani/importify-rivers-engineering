# REA Importify, self-hosted.
#
#   deploy/scripts/init-env.sh            # once: writes deploy/.env with generated secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml --profile worker up -d   # optional separate worker
#
# Only the web server publishes ports. PostgreSQL and the API stay on the internal network.
name: rea

x-api-env: &api-env
  REA_DATABASE_URL: postgres://rea:${POSTGRES_PASSWORD:?run deploy/scripts/init-env.sh}@db:5432/rea?sslmode=disable
  REA_SECRET_KEY: ${REA_SECRET_KEY:?run deploy/scripts/init-env.sh}
  REA_SETUP_TOKEN: ${REA_SETUP_TOKEN:-}
  REA_PUBLIC_URL: ${REA_PUBLIC_URL:-http://localhost}
  REA_ALLOWED_ORIGINS: ${REA_ALLOWED_ORIGINS:-}
  REA_TRUSTED_PROXIES: ${REA_DOCKER_SUBNET:-172.29.10.0/24}
  REA_WORKER_MODE: ${REA_WORKER_MODE:-embedded}
  REA_WORKER_CONCURRENCY: ${REA_WORKER_CONCURRENCY:-2}
  REA_SERVER_FETCH_ENABLED: ${REA_SERVER_FETCH_ENABLED:-false}
  REA_FETCH_ALLOW_PRIVATE_NETWORKS: ${REA_FETCH_ALLOW_PRIVATE_NETWORKS:-false}
  REA_MAX_UPLOAD_MB: ${REA_MAX_UPLOAD_MB:-25}
  REA_MAX_ARCHIVE_UNCOMPRESSED_MB: ${REA_MAX_ARCHIVE_UNCOMPRESSED_MB:-300}
  REA_MAX_ARCHIVE_FILES: ${REA_MAX_ARCHIVE_FILES:-20000}
  REA_REPO_ROOTS: ${REA_REPO_ROOTS:-}
  REA_INTEGRATION_RATE_LIMIT: ${REA_INTEGRATION_RATE_LIMIT:-600}
  REA_CATALOG_CHANGES_RETENTION_DAYS: ${REA_CATALOG_CHANGES_RETENTION_DAYS:-90}
  REA_WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${REA_WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
  REA_WEBHOOK_ALLOW_HTTP_LOCALHOST: ${REA_WEBHOOK_ALLOW_HTTP_LOCALHOST:-false}
  REA_WEBHOOK_TIMEOUT: ${REA_WEBHOOK_TIMEOUT:-10s}
  REA_WEBHOOK_MAX_ATTEMPTS: ${REA_WEBHOOK_MAX_ATTEMPTS:-10}
  REA_WEBHOOK_RETRY_BASE: ${REA_WEBHOOK_RETRY_BASE:-1m}
  REA_WEBHOOK_RETRY_MAX: ${REA_WEBHOOK_RETRY_MAX:-6h}
  REA_WEBHOOK_DISABLE_AFTER_FAILURES: ${REA_WEBHOOK_DISABLE_AFTER_FAILURES:-20}
  REA_WEBHOOK_DISABLE_FAILING_FOR: ${REA_WEBHOOK_DISABLE_FAILING_FOR:-1h}
  REA_WEBHOOK_CONCURRENCY: ${REA_WEBHOOK_CONCURRENCY:-2}
  REA_WEBHOOK_LOG_RETENTION_DAYS: ${REA_WEBHOOK_LOG_RETENTION_DAYS:-30}
  REA_SESSION_TTL: ${REA_SESSION_TTL:-168h}
  REA_SESSION_IDLE: ${REA_SESSION_IDLE:-24h}
  REA_LOG_LEVEL: ${REA_LOG_LEVEL:-info}
  REA_VERSION: ${REA_VERSION:-1.0.0}

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: rea
      POSTGRES_USER: rea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/scripts/init-env.sh}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [rea]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rea -d rea"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
      args:
        VERSION: ${REA_VERSION:-1.0.0}
    image: rea-importify/api:${REA_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *api-env
    volumes:
      - rea-data:/data
      # Optional read-only repositories for "repository path" analysis (see REA_REPO_ROOTS):
      # - /srv/code:/repos:ro
    networks: [rea]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  worker:
    profiles: [worker]
    image: rea-importify/api:${REA_VERSION:-1.0.0}
    restart: unless-stopped
    entrypoint: ["rea-worker"]
    command: []
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-env
      REA_WORKER_MODE: embedded
    volumes:
      - rea-data:/data
    networks: [rea]
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    image: rea-importify/web:${REA_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      REA_SITE_ADDRESS: ${REA_SITE_ADDRESS:-http://localhost}
      REA_ACME_EMAIL: ${REA_ACME_EMAIL:-}
      REA_API_UPSTREAM: api:8080
      REA_PROXY_MAX_BODY: ${REA_PROXY_MAX_BODY:-600MB}
      REA_UPSTREAM_TRUSTED_PROXIES: ${REA_UPSTREAM_TRUSTED_PROXIES:-private_ranges}
    ports:
      - "${REA_BIND_ADDRESS:-0.0.0.0}:${REA_HTTP_PORT:-80}:80"
      - "${REA_BIND_ADDRESS:-0.0.0.0}:${REA_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [rea]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

volumes:
  pgdata:
  rea-data:
  caddy-data:
  caddy-config:

networks:
  rea:
    ipam:
      config:
        - subnet: ${REA_DOCKER_SUBNET:-172.29.10.0/24}
